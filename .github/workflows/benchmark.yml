name: Decay Benchmark

on:
  pull_request:
    paths:
      - "attention.py"
      - "positional_encodings.py"
      - "experiment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run distance decay experiment
        run: python experiment.py

      - name: Upload plot
        uses: actions/upload-artifact@v4
        with:
          name: decay-benchmark-plot
          path: assets/decay_plot.png

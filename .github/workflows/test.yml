name: Model Component Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pytest

      - name: Run PyTest Verification Suite
        run: |
          # Verifies RoPE vector norm preservation & tensor shapes
          pytest sandbox/test_encodings.py
